Local.4228d9c89a7b96f4=<html>%1$s<p>颜色识别需要稳定、准确的颜色。自动白平衡会漂移，相机自身的手动白平衡又往往仅调整红蓝比例，因此 OpenPnP 提供固定白平衡校准。</p><p>请在画面中放置合适的校准物，例如拉丝金属或纸张。可用带孔、倒角和阴影的金属物体形成丰富的明暗层次，避免出现彩色物体，并保持与实际工作相同的照明。</p><p>也可在相机 %2$s 的“白平衡”页手动校准。详细说明见下方蓝色信息按钮。</p><p>准备好后点击“接受”。</p></html>
