CameraVisionConfigurationWizard.Action.SettleTestRearAction.Description=<html>\r\n向后移动一段距离再返回，然后进行相机稳定测试。<br/>\r\n使用此时操作面板中距离/角度的设定值作为增量距离，进行移动。 \r\n</html>
CameraVisionConfigurationWizard.Action.SettleTestRightAction.Description=<html>\r\n向右移动一段距离再返回，然后进行相机稳定测试。<br/>\r\n使用此时操作面板中距离/角度的设定值作为增量距离，进行移动。 \r\n</html>
CameraVisionConfigurationWizard.Action.SettleTestRotateAction.Description=<html>\r\n旋转一定角度再返回，然后进行相机稳定测试。<br/>\r\n使用此时操作面板中距离/角度的设定值作为增量角度，进行转动。 \r\n</html>
CameraVisionConfigurationWizard.Action.SettleTestUpAction.Description=<html>\r\n将吸嘴移动至相机上方并处于Z 轴安全高度的位置，<br/>\r\n或仅移动到SafeZ的位置并返回，然后进行相机稳定测试。\r\n</html>
