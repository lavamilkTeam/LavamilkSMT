AbstractActuatorConfigurationWizard.GeneralPanel.ValueTypeLabel.toolTipText=<html>\n<p>\n定义执行器写入值的主数据类型。\n</p>\n<ul>\n<li><strong>Boolean\:</strong><br/>用于ON/OFF切换的开关型执行器。</li>\n<li><strong>Double\:</strong><br/>用于驱动标量值的数值型执行器。</li>\n<li><strong>String\:</strong><br/>用于驱动任意代码和值的文本型执行器。</li>\n<li><strong>Profile\:</strong><br/>，可定义出多个可命名的Profiles项，并驱动其他执行器的多选配置型执行器。<br/>\n点击“应用”按钮，以启用“Profiles”选项卡。</li>\n</ul>\n<strong>注意\:</strong> 执行器在实际操作中不会强制使用主数据类型，<br/>\n仍可混合使用其他类型(以保持向后兼容性)。\n</html>
