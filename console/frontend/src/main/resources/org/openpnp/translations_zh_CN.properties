Local.4acdd614c18ab4c9=<html><p>选择识别方式后，点击“重置视觉流程”载入相应的默认流程。</p><ul><li>颜色识别（ColorKeyed）：定位孔下方背景需要有鲜明的颜色，默认为绿色。</li><li>圆对称识别（CircularSymmetry）：孔形应为圆形，孔内外背景应均匀。</li></ul><p>两种方式都会结合孔径、排列方向、孔间距及预期距离进一步筛选定位孔。</p></html>
