Local.79aaa8e5c12af244=<html><p>在设备台面上安装一个永久基准点，安装位置应与台面的关键结构可靠连接，并尽量避免日后移动。基准点高度应与 PCB 表面一致，详细要求见下方蓝色信息按钮。</p><p>先通过控制器或手动方式完成设备回零，确保当前使用的是目标坐标系。</p><p>点动相机 %1$s 至基准点上方，用十字线粗略对准。调整“特征直径”，确认绿色圆圈和十字线贴合基准点轮廓，可用滚轮缩放。</p><p>点击“接受”，检测精确位置并将其设为视觉回零基准。</p><p>此操作不会改变当前机器坐标系，而是将其绑定到永久基准点。之后即使回零开关等机械位置轻微变化，也能恢复准确的 X、Y 基准。</p></html>
