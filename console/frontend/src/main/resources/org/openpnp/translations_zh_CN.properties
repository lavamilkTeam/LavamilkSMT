ReferenceCameraCalibrationWizard.CameraCalibrationPanel.CautionLabel.text=<html><p width\="500" style\="color\:Black;background-color\:Yellow;">警告 - 在校准过程中，吸嘴尖将会下降到这些Z值高度，并将在相机的<b>整个视野范围内</b>移动。<br/>\n 在开始校准之前，请确保吸嘴尖与相机附近的任何障碍物之间有足够的运动空间，否则可能会发生机器损坏。</p></html>
