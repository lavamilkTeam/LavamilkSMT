Local.8f2578892fac8bc4=<html><p>上视相机可通过观察吸嘴头并配合吸嘴运动自动校准。本步骤确定相机的 X、Y 位置，并进行初步校准。</p><p>为吸嘴组件 %1$s 装上能够稳定识别的最小吸嘴头，必要时尝试不同型号。</p><p>点动吸嘴 %2$s 至相机 %3$s 上方，用十字线对准。降低吸嘴头直至清晰成像，其 Z 高度应大致与 PCB 表面一致；若差距较大，请调整相机焦距。已启用自动对焦时，会用它测定精确 Z 位置。</p><p>调整“特征直径”，确认绿色圆圈和十字线贴合目标轮廓，可用滚轮缩放。请选择从侧面也能稳定识别的锐利圆形边缘，通常为气孔轮廓。</p><p>点击“接受”采集相机位置。</p></html>
