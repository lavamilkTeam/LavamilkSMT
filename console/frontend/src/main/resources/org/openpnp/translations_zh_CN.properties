OpenPnpCaptureCameraConfigurationWizard.DevicePanel.CaptureFPSLabel.toolTipText=<html>\r\n<p>该测试会以尽可能快的速度去捕获画面帧，并计算出所能得到的平均帧率（FPS）。</p>\r\n<p>从相机缓存复制出画面帧，并转换为Java图像， <br/>\r\n此过程并不进行任何额外的处理，如镜头校正、图像变换等。</p>\r\n<p>为了得到最精确的结果，请先将通用配置菜单中的<strong>预览FPS</strong>设为0。</p>\r\n</html>
