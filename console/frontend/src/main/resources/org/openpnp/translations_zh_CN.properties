CameraVisionConfigurationWizard.VisionPanel.CenterMaskLabel.toolTipText=<html>\n<p>中心圆形蒙板遮罩的大小，是相对于相机视图的尺寸而言的（取其高度或宽度值较小的那个）。</p>\n<p>例如：</p>\n<ul>\n<li>0.0：无蒙板遮罩</li>\n<li>0.5：圆形中心区域为相机视图的一半大小</li>\n<li>1.0：圆形中心区域延伸至相机视图的边缘</li>\n<li>1.5：圆形区域超出相机视图，产生渐晕的暗角效果</li>\n</ul>\n</html>
