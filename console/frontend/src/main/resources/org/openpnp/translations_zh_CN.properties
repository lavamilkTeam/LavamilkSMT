CameraVisionConfigurationWizard.Action.SettleTestFrontAction.Description=<html>\r\n向前移动一段距离再返回，然后进行相机稳定测试。<br/>\r\n使用此时操作面板中距离/角度的设定值作为增量距离，进行移动。 \r\n</html>
