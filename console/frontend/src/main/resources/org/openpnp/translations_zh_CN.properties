BoardsPanel.BoardPlacements.Importer.OptionsBox.Question=<Html><body style\='width\: 400'><p>请问，您想采取何种操作？</p><p> </p><p>选择<b>合并</b>\: </p><p>①与现有列表中ID相同的项，将被更新至即将导入的内容。</p><p>②保留现有列表中，原有的那些不存在于即将导入内容中的项。</p><p>③即将导入内容中的新增项，将添加至现有列表中。</p><p> </p><p>选择<b>替换</b>\: </p><p>清空现有的贴装列表，然后使用即将导入的内容。</p></html>
