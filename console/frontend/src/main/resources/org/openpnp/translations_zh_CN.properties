ReferenceNozzleTipToolChangerWizard.Action.ResetTemplateImageEmpty=重置
ReferenceNozzleTipToolChangerWizard.Action.ResetTemplateImageEmpty.Description=<html>重置吸嘴头槽口为 空 时的模板图像。</html>
ReferenceNozzleTipToolChangerWizard.Action.VisionCalibrateTest=测试
ReferenceNozzleTipToolChangerWizard.Action.VisionCalibrateTest.Description=<html>进行视觉校准测试。</html>
