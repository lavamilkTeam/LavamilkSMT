Local.53bb3e6561772d24=<html><p>反向间隙补偿用于减小传动机构松动或间隙造成的定位误差，详细说明见下方蓝色信息按钮。</p><p>在满足精度要求的前提下，可适当放宽“允许偏差 ±”，以采用更高效的补偿方式，减少额外移动和换向。</p><p><strong color\="red">注意：</strong>相机 %1$s 将移至主基准点上方，运动轴 %2$s 会在整个软限位范围内执行校准运动。</p><p>确定新补偿方式后，机器还会执行视觉回零，重新校准可能受补偿方式影响的坐标系。</p><p>准备好后点击“接受”。</p>%3$s</html>
