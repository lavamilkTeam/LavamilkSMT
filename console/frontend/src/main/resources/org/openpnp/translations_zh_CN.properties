Local.7a389ab45b4df91e=<html>设置 OCR 检测到飞达中元件 ID 不符时的处理方式。<ul><li><strong>不处理（None）</strong>：不使用 OCR。</li><li><strong>交换飞达（SwapFeeders）</strong>：若正确元件已分配给另一个推拉式飞达，则交换两者的位置，并启用换入的飞达。适用于拆装或重新排列飞达后的识别。</li><li><strong>交换或新建（SwapOrCreate）</strong>：优先交换；若找不到装有正确元件的飞达，则新建飞达并放到当前位置，同时禁用原飞达，避免同一位置有两个飞达同时启用。</li><li><strong>更换元件（ChangePart）</strong>：直接修改当前飞达的元件。仅适用于换料或重排后料带等设置保持相同的飞达组。</li><li><strong>更换元件并复制设置（ChangePartAndClone）</strong>：修改当前飞达的元件，并从模板飞达复制设置。</li></ul></html>
Local.7a4bfe2ec993c653=<html>进料前读取旋转轴当前坐标，作为基准角度。<br/>下方设置的旋转角度将累加到此基准上。<br/>通常用于剥膜轴，使盖带收卷轴持续转动。</html>
