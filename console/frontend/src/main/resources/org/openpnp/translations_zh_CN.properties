OpenPnpCaptureCameraConfigurationWizard.PropertiesPanel.FreezePropertiesLabel.toolTipText=<html>\n<p>启用后，将冻结当前的属性状态。<br/>\n(会被存储到machine.xml配置文件中)<br/>\n每当以后重新打开相机时，将重新调取并重新应用这些属性设置。<br/>\n不会被相机设备中实时查询到的属性值所覆盖。<p/>\n<p>当相机的驱动程序无法正确保存或保持属性设置，<br/>\n或者您需要在不同的属性配置或其他应用程序中使用此相机时，<br/>\n请勾选该选项。<p/>\n</html>
