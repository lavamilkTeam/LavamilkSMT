ReferenceNozzleTipToolChangerWizard.ChangerPanel.CalibrationOffsetZTextField.toolTipText=校准得到的吸嘴组件的Z偏移量
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ChangerMidToEndSpeedTextField.toolTipText=位置3和4之间的速度系数
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ChangerMidToMid2SpeedTextField.toolTipText=位置2和3之间的速度系数
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ChangerStartToMidSpeedTextField.toolTipText=位置1和2之间的速度系数
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FailHomingLabel.text=致回零失败？
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FailHomingLabel.toolTipText=回零过程中，如果该Z偏移校准失败，将导致整个回零不成功。
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.text=位置1
ReferenceNozzleTipToolChangerWizard.ChangerPanel.FirstLocationLabel.toolTipText=<html>位置1是装载吸嘴头时动作序列的起点。<br/>\n装载吸嘴头时的第一个路径点，也是卸载吸嘴头时的最后一个路径点。\n</html>
ReferenceNozzleTipToolChangerWizard.ChangerPanel.LastLocationLabel.text=位置4
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post1ActuatorLabel.text=触发执行器1
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post2ActuatorLabel.text=触发执行器2
ReferenceNozzleTipToolChangerWizard.ChangerPanel.Post3ActuatorLabel.text=触发执行器3
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SecondLocationLabel.text=位置2
ReferenceNozzleTipToolChangerWizard.ChangerPanel.SpeedLabel.text=速度系数 (1\=100%)
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ThirdLocationLabel.text=位置3
ReferenceNozzleTipToolChangerWizard.ChangerPanel.TouchLocationLabel.text=触碰位置
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.text=自动Z校准
ReferenceNozzleTipToolChangerWizard.ChangerPanel.ZCalibrateLabel.toolTipText=<html>\n通过探测<strong>Touch Location(触碰位置)</strong>的表面，对吸嘴组件或吸嘴头尖进行高度的Z校准。  <br/>\nZ校准可通过手动触发，点击<strong>立即校准</strong>按钮，也可以自动触发：<br/>\n<ul>\n<li><strong>Manual：</strong> 不自动进行Z校准。<br/>\n手动校准结果将被永久地保存在配置文件中，并在执行回零过程中，保持有效。</li>\n<li><strong>MachineHome：</strong> 完成回零后，机器才会自动进行Z校准。<br/>\nZ校准结果，此后将复用给其他要装入的吸嘴头。</li>\n<li><strong>NozzleTipChange：</strong>每当装入此枚吸嘴头时，<br/>\n或当已经装入了此枚吸嘴头的机器完成回零后，便会自动进行Z校准。</li>\n</ul>\n注意，您可以使用一个命名为"unloaded"的吸嘴头作为替身，对裸连杆进行Z校准。 \n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.text=状态标记
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.BehaviorLabel.toolTipText=<html>\n某个吸嘴头可标记为<strong>Template</strong>，供其他吸嘴头从中克隆。<br/>\nOpenPnP会自动将吸嘴头的各个位置，根据其自身已有的"位置1"数据进行转换。<br/>\n如果某些个别的吸嘴头具有特殊用途，请把其标记为<strong>Locked</strong>，进行锁定，以防止克隆。\n</html>
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.Border.title=克隆设置
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.text=模板
ReferenceNozzleTipToolChangerWizard.CloningSettingsPanel.TemplateRadioButton.toolTipText=将当前吸嘴头标记为Template，作为克隆参数的来源，可克隆给也可被其他吸嘴头克隆。
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.text=从Template克隆
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ClonesFromTemplateRadioButton.toolTipText=当前吸嘴头可以从标记为<strong>Template</strong>的吸嘴头上，获得克隆参数。
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LocationsLabel.text=自动转换 位置 信息？
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.text=锁定
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.LockedRadioButton.toolTipText=<html>此吸嘴头被锁定，无法进行克隆。<br/>注意，其触碰位置的Z坐标，仍可基于Template吸嘴头的参考位置，进行校准。</html>
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.VisionCalibrationLabel.text=包含 视觉校准 信息？
ReferenceNozzleTipToolChangerWizard.UnnamedPanel.ZCalibrationLabel.text=包含 Z校准 信息？
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.text=Z调整量
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.AdjustZLabel.toolTipText=<html>\n通过此偏移值来调整视觉位置的Z坐标。 <br/>\n将其设定为视觉校准中识别的模板对象(例如更换器插槽的可见表面)与吸嘴头在该位置时(假设的)下底面之间Z向的间距。<br/>\n若吸嘴头位于该表面下方，则进行正调整；若位于上方，则进行负调整。<br/> \n此设置有助于消除相机视图中的缩放误差，尤其是当物体比平时更靠近相机时。<br/>\n<strong>相机必须设置了3D的像素当量(3D Units per Pixel)。</strong> \n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.Border.title=视觉校准
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.CalibrationTriggerLabel.text=触发校准的方式
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.LastScoreLabel.text=最后评分
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MaxPassesLabel.text=【最大】检测次数
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.text=最低评分
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.MinScoreLabel.toolTipText=<html>\n当模板图像与相机图像进行匹配时，会计算出一个分数来指示匹配的质量。<br/>\n 如果获得的分数小于此处给定的最低评分，则校准失败。<br/>\n这应该能够阻止机器在位置错误时，去尝试更换吸嘴头。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateEmptyLabel.text=空置时的图像模板
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.text=模板的图像高度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateHeightLabel.toolTipText=<html>\n模板图像高度（Y）。模板图像以选定的 视觉位置 为中心。<br/>\n尽可能选择较小的尺寸，但模板图像中应包含明显的水平和垂直边缘。<br/>\n 此外，当吸嘴头占据插槽时，吸嘴头应该是可见的。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateOccupiedLabel.text=占用时的图像模板
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.text=模板的图像宽度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.TemplateWidthLabel.toolTipText=<html>\n模板图像高度（X）。模板图像以选定的 视觉位置 为中心。<br/>\n尽可能选择较小的尺寸，但模板图像中应包含明显的水平和垂直边缘。<br/>\n 此外，当吸嘴头占据插槽时，吸嘴头应该是可见的。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.text=公差
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.ToleranceLabel.toolTipText=最大的校准公差，即校准后的位置可以偏离标称位置的最大偏差距离。
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionCalibrationHelpLabel.text=<html>\n分别拍摄吸嘴头插槽在空置和被占用状态下的两张模板图像。<br/>\n使用这两张模板图像，视觉校准将在X/Y方向上，校准吸嘴头更换所使用的位置，<br/>\n同时确保了吸嘴头插槽如预期那般，处于空置或是被占用的状态。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.text=视觉位置
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.VisionLocationLabel.toolTipText=<html>进行视觉校准的位置，None表示不进行校准。<br/>\n选择一个在吸嘴头插槽中，可以看到吸嘴头的位置。\n</html>
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.text=期望的精度
ReferenceNozzleTipToolChangerWizard.VisionCalibrationPanel.WantedPrecisionLabel.toolTipText=<html>如果检测到的图像与模板图像的匹配结果，超出了<strong>期望精度</strong>,<br/>\n则相机会重新居中并进行另一次视觉检测。</html>
ReferenceNozzleToolChangerWizard.ChangerPanel.Border.title=吸嘴更换器
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangeOnManualLabel.text=手动更换吸嘴？
ReferenceNozzleToolChangerWizard.ChangerPanel.ChangerEnabledLabel.text=自动更换吸嘴？
ReferenceNozzleToolChangerWizard.ChangerPanel.ManualChangeLocationLabel.text=手动换嘴位置
ReferenceNozzleVacuumWizard.ContentPanel.BlowOffActuatorLabel.text=吹气执行器
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.text=关闭真空执行器？
ReferenceNozzleVacuumWizard.ContentPanel.ClosesVacuumActuatorLabel.toolTipText=<html>\r\n启动吹气执行器会<em>隐藏式的</em>关闭真空执行器。<br/>\r\n勾选该选项后，就省去了对真空执行器<em>刻意的</em>关闭操作。\r\n</html>
ReferenceNozzleVacuumWizard.ContentPanel.SensingActuatorLabel.text=真空传感器
ReferenceNozzleVacuumWizard.ContentPanel.VacuumActuatorLabel.text=真空执行器
ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.text=优化多吸嘴运动路径
ReferencePnpJobProcessorConfigurationWizard.lblOptimizeMultipleNozzles.toolTipText=通过调整吸嘴的处理次序，优化多吸嘴机器在执行拾取、对齐和放置操作时的运动路径。
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.text=提前旋转所有的吸嘴
ReferencePnpJobProcessorConfigurationWizard.lblPreRotateAllNozzles.toolTipText=<html>在到达首个供料或取料位置、底部相机检测位置以及首个贴装位置置之前，对所有的吸嘴进行提前旋转和调整。<br/>如果提前旋转当前吸嘴所需的调整时间，预计将会超过下一个吸嘴到达其取料位置、底部相机检测位置以及首个贴装位置置所需的时间，<br/>那么，启用该选项，将有效提升工作效率，并能显著降低元件在吸嘴上发生滑动的潜在风险。</html>
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.text="单步"停止于动作步
ReferencePnpJobProcessorConfigurationWizard.lblStepsMotion.toolTipText=点击任务中的“单步”按钮后，程序将在执行完下一个带有运动动作的步骤后停止。
