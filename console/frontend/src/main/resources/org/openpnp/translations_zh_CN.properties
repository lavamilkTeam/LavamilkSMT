Local.91c52f1f77ae3fd6=<html><p>启用动态 Z 轴安全高度后，需要在安全区间内预留额外抬升行程，以容纳较高元件。预期元件高度上限在吸嘴头的“最大元件高度”中设置。</p><p>吸嘴组件 %1$s 的兼容吸嘴头 %2$s 设置了最大元件高度 %3$s，超过安全区间 %4$s。该区间由运动轴 %5$s 配置，原始坐标范围为 %6$s 至 %7$s。</p><p>可适当减小吸嘴 %8$s 的安全间隙以扩大可用行程，或调低吸嘴头 %9$s 的最大元件高度。</p><p>调整安全间隙时，建议重新完成吸嘴 %10$s 的安全高度设置：勾选“显示已解决的问题”，重新打开“设置 %11$s 的 Z 轴安全高度”并执行。</p></html>
