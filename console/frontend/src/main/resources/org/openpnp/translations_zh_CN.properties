ReferenceNozzleTipToolChangerWizard.Action.CalibrateZ.Description=<html>通过接触探测<strong>Touch Location(触碰位置)</strong>的表面，对吸嘴组件或吸嘴头在Z向上的偏移进行校准。</html>
ReferenceNozzleTipToolChangerWizard.Action.CaptureTemplateImageEmpty=拍摄
ReferenceNozzleTipToolChangerWizard.Action.CaptureTemplateImageEmpty.Description=<html>捕获吸嘴头槽口为 空 时的模板图像。</html>
ReferenceNozzleTipToolChangerWizard.Action.CaptureTemplateImageOccupied=拍摄
ReferenceNozzleTipToolChangerWizard.Action.CaptureTemplateImageOccupied.Description=<html>捕获吸嘴头槽口被 占用 时的模板图像。</html>
ReferenceNozzleTipToolChangerWizard.Action.CloneFromNozzleTip=从Template吸嘴头中克隆出吸嘴头更换器配置参数
ReferenceNozzleTipToolChangerWizard.Action.CloneFromNozzleTip.Description=<html>从标记为<strong>Template</strong>的吸嘴头中克隆吸嘴头更换器的参数，供其他吸嘴头使用。<br/>其他吸嘴头的各个位置可以根据其自身的"位置1"数据而进行转换。</html>
ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip=将已克隆出的吸嘴头更换器参数分发给当前吸嘴头
ReferenceNozzleTipToolChangerWizard.Action.CloneToAllNozzleTip.Description=<html>将来自<strong>Template</strong>吸嘴头的吸嘴头更换器克隆参数，分发给当前吸嘴头。<br/>当前吸嘴头的各个位置可以根据其自身已有的"位置1"数据而进行转换。</html>
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ=将当前吸嘴头触碰位置的Z坐标校准至Template
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>将所有吸嘴头尖触碰位置(Touch Location)的Z坐标校准至<strong>Template</strong>模板所参考的高度。<br/>这将会把标记为<strong>Template</strong>的吸嘴头装载到默认的探测连杆(probing nozzle)上，<br/>重新校准Template吸嘴头触碰位置的Z坐标，然后以此为基准对其他所有的吸嘴头进行探测并校准。<br/>请注意，与克隆操作不同的是，此操作包含那些已被标记为<strong>Locked(锁定)</strong>的吸嘴头。</html>
ReferenceNozzleTipToolChangerWizard.Action.Reset=重置
ReferenceNozzleTipToolChangerWizard.Action.Reset.Description=<html>重置Z偏移的校准结果。</html>
