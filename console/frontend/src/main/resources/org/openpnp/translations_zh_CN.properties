Local.202ca949cf0ce24a=对称目标的截面评价方式：<ul><li>FullSymmetry：同时检查内部及外形，适合真正对称的目标，精度最高。</li><li>EdgeSymmetry：检查内部及外形边缘，适合部分特征不对称或两侧亮度不同的目标。</li><li>OutlineSymmetry：只检查外形，适合内部不对称的目标。</li><li>OutlineEdgeSymmetry：只检查外形边缘，适合两侧部分特征缺失或亮度不同的目标。</li><li>OutlineSymmetryMasked：只检查遮罩外形，适合明显不对称的目标，需要设置 threshold。</li></ul>
