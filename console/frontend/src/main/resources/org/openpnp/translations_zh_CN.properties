Local.04b7f523cdb186fa=<html><p>为精确校准相机与吸嘴之间的偏移量，吸嘴会吸取、旋转并放回测试件，再由相机测量位置变化。测试件的选用要求见下方蓝色信息按钮。</p><p>将测试件放在主校准基准点上。点动相机 %1$s 至测试件上方，用十字线对准。</p><p>调整“特征直径”，确认绿色圆圈与十字线贴合测试件轮廓，可用滚轮缩放。</p><p><strong color\="red">注意：</strong>吸嘴 %2$s 将移至测试件处并执行取放校准。请先装好合适的吸嘴头，确认真空系统就绪。</p><p>准备好后点击“接受”。</p>%3$s</html>
