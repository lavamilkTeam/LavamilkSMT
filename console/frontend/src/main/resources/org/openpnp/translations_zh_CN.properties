GcodeDriverSettings.SettingsPanel.BackslashEscapedCharactersLabel.toolTipText=<html>允许将Unicode字符以\\\ruxxxx的方式插入到Gcode字符串中，其中xxxx是4个16进制字符。<br/>同时，也允许使用\\t表示制表符，\\b表示退格，\\n表示换行，\\r表示回车，以及\\f表示换页。</html>
