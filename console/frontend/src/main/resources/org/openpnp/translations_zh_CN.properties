ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.SaturationLabel.toolTipText=HSV色彩模型中的饱和度
ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.ShowProblemsButton.text=显示问题
ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.ShowProblemsButton.toolTipText=在相机预览中，显示存在问题的图像区域。
ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.ToleranceLabel.text=容差值
ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.ValueLabel.text=明亮度
ReferenceNozzleTipCalibrationWizard.BackgroundCalibrationPanel.ValueLabel.toolTipText=HSV色模型中的明亮度
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.AllowMisDetectsLabel.text=允许的误检次数
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.AllowMisDetectsLabel.toolTipText=校准失败前，所允许的检测失败次数。
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.AngleIncrementsLabel.text=圆等分检测次数
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.Border.title=吸嘴头校准
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.text=校准所需的Z偏移
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.CalibrationZOffsetLabel.toolTipText=<html>\n<p>\n当吸嘴头所需的视觉检测特征高于吸嘴头尖时，<br />\n建议使用"Z偏移"来平移焦距面。\n</p>\n<p>如果某个吸嘴头被命名为 "unloaded"，<br />\n则它将被用作裸吸嘴头支架校准的替身。<br />\n同样，可以使用"Z偏移"修改至恰当的焦距平面上进行校准。<br />\n补充：裸吸嘴头支架可理解为：未安装吸嘴头的吸嘴头夹套、夹具或吸嘴头套杆。\n</p>\n</html>
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.EditPipelineButton.text=编辑
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.OffsetThresholdLabel.text=偏移阈值
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.PipelineLabel.text=视觉通道
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.ResetPipelineButton.text=重置
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.StatusLabel.text=当前状态
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.VisionDiameterLabel.text=特征直径
ReferenceNozzleTipCalibrationWizard.CalibrationPanel.VisionDiameterLabel.toolTipText=<html>\n吸嘴头尖的视觉特征或其边缘轮廓的直径，可在校准视觉中被检测到。<br/>\n仅在视觉管道的DetectCircularSymmetry阶段发挥作用。\n</html>
ReferenceNozzleTipCalibrationWizard.TopPanel.Border.title=校准设置
ReferenceNozzleTipCalibrationWizard.TopPanel.CalibrateButton.text=校准
ReferenceNozzleTipCalibrationWizard.TopPanel.CalibrateCameraButton.text=校准相机位置和旋转角度
ReferenceNozzleTipCalibrationWizard.TopPanel.CalibrateCameraButton.toolTipText=<html>\n根据测量到的吸嘴组件位置数据，校准底部相机的定位位置及旋转角度\n</html>
ReferenceNozzleTipCalibrationWizard.TopPanel.CalibrationEnabledChkBox.text=启用？
ReferenceNozzleTipCalibrationWizard.TopPanel.CalibrationLabel.text=校准
ReferenceNozzleTipCalibrationWizard.TopPanel.FailHomingLabel.text=致回零失败？
ReferenceNozzleTipCalibrationWizard.TopPanel.FailHomingLabel.toolTipText=回零过程中，如果该吸嘴头校准失败，将导致整个回零不成功。(小房子将显示为黄色)
ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.text=自动重新校准
ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>确定何时为吸嘴头自动执行重新校准：</p>\n<p><ul><li>NozzleTipChange：每次更换此枚吸嘴头时。</li>\n<li>NozzleTipChangeInJob：每次更换此枚吸嘴头时，但限于贴片任务期间。</li>\n<li>MachineHome：在机器执行回零期间和首次装入此枚吸嘴头时。 </li></ul></p>\n<p>Manual：只能手动校准，校准信息存储在配置文件中(只推荐用于具备C轴归位功能的机器)。</p>\n</html>
ReferenceNozzleTipCalibrationWizard.TopPanel.ResetButton.text=重置
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.Border.title=元件尺寸设定
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartDiameterLabel.text=【最大】元件直径
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartDiameterLabel.toolTipText=<html>\nMax. Part Diameter：该吸嘴头所能拾取的元件的最大直径或其对角线的最大长度，包含公差。<br/>\n在默认的底部视觉通道中，该值参与了MaskCircle的蒙板阶段，限定出图像有效区域的大小。\n</html>
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartHeightLabel.text=【最大】元件高度
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPartHeightLabel.toolTipText=<html>\nMax. Part Height：该吸嘴头所能拾取元件的最大高度。<br/>\n当某元件的高度未知时，则该此处数值将被用于动态SafeZ的功能中。\n</html>
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.text=【最大】取料偏差
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MaxPickToleranceLabel.toolTipText=<html>\nMax. Pick Tolerance：使用该吸嘴头取料时，所能允许的最大假设偏差。<br/>\n这决定了检测得到的底部视觉对齐位置与吸嘴头尖中心位置之间，可接受的最大偏离程度。<br/>\n同时，通过限制搜索范围，它还可以减少某些视觉操作所需的消耗时间。\n</html>
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.text=【最小】元件直径
ReferenceNozzleTipConfigurationWizard.PartDimensionsPanel.MinPartDiameterLabel.toolTipText=<html>\nMin. Part Diameter：该吸嘴头所能拾取的元件的最小直径。<br/>\n注意，<strong>最小元件直径</strong> 减去2倍的 <strong>最大取料偏差</strong>，决定出吸嘴头尖 <em>内径</em> 的最小范围。<br/>\n该范围被视为始终会被吸嘴头上的元件所覆盖。<br/>\n在进行"吸嘴头背景校准"的关键基色分析和诊断时，将忽略掉这块范围。\n</html>
ReferenceNozzleTipConfigurationWizard.PickAndPlacePanel.Border.title=取料&放料 设定
