ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ=Calibrate all Touch Locations' Z to Template
ReferenceNozzleTipToolChangerWizard.Action.ReferenceZ.Description=<html>Calibrate all the nozzle tip's touch location Z to the <strong>Template</strong> reference.<br/>This will load the template nozzle tip on the default probing nozzle, recalibrate<br/>the template's touch location Z and then probe and reference all the others to it.<br/>Note, unlike cloning this does include nozzle tips marked as <strong>Locked</strong>.</html>
