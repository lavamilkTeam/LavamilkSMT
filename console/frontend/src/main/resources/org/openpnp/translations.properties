Local.bbd3df828b6c18eb=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzles need a head-room, the so-called Safe Z Zone to lift the nozzles higher with taller parts. On nozzles with shared Z axes the part heights compete for the same head-room. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle %1$s with compatible tip %2$s has a <strong>Max. Part Height</strong> of %3$s, furthermore, nozzle %4$s with compatible tip %5$s has a largest <strong>Max. Part Height</strong> of %6$s, which in combination (and after transformation) is larger than the Safe Z Zone of %7$s. Note, the safe Z Zone is configured on the %8$s axis to reach from %9$s to %10$s in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle %11$s and %12$s Z clearances, or reduce the <strong>Max. Part Height</strong> on nozzle tips %13$s and %14$s.</p><br/><p>Reducing Z clearances is best done by revisiting the Safe Z solutions for nozzles %15$s and %16$s. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of %17$s" solution and redo it.</p></html>
