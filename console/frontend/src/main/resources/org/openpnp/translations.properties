GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofJerkStepsLabel.toolTipText=<html>\r\nMaximum number of interpolation steps used to simulate jerk control.<br/>\r\nThis means the acceleration will be ramped up or down in so many steps <br/>\r\nrelative to maximum acceleration.\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.text=Maximum Number of Steps
GcodeAsyncDriverSettings.InterpolationPanel.MaximumNumberofStepsLabel.toolTipText=<html>\r\nMaximum number of steps that can be used for interpolation of one move.<br>\r\nUse a portion of your controller's maximum queue depth. <br/>\r\nIf the number is exceeded, the motion planner will fall back to a single moderated move. \r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.text=Minimum Axis Resolution Ticks
GcodeAsyncDriverSettings.InterpolationPanel.MinimumAxisResolutionTicksLabel.toolTipText=<html>\r\n<p>Minimum step axis distance used to interpolate advanced motion paths.</p>\r\n<p>This is given in resolution ticks of the axes.</p>\r\n</html>
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.text=Minimum Step Time [s]
GcodeAsyncDriverSettings.InterpolationPanel.MinimumStepTimeLabel.toolTipText=<html>\r\n<p>The minimal time step used to interpolate advanced motion paths. Specified in seconds.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.Border.title=Settings
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.text=Confirmation Flow Control?
GcodeAsyncDriverSettings.SettingsPanel.ConfirmationFlowControlLabel.toolTipText=<html>\r\n<p>The communication with the controller is flow-controlled by awaiting the "ok"<br/>\r\nbefore sending the next command. </p>\r\n<p>This is slower than other types of flow control such as RTS/CTS on a serial connection, so <br/>\r\nthe latter should be preferred.</p>\r\n</html>
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.text=Location Confirmation?
GcodeAsyncDriverSettings.SettingsPanel.LocationConfirmationLabel.toolTipText=<html>Request the controller to report the location after a motion has completed.<br/>\r\nIf it has changed, the internal OpenPnP location is updated. The location report is <br/>\r\nalso used to synchronize OpenPnP when confirmation flow control is disabled.<br/>\r\nAt least on of the two options need to be enabled. Location Confirmation allows<br/>\r\nmore extensive asynchronous operation. \r\n</html>
