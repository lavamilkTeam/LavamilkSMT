Local.914126467fefc238=Set the symmetry score calculation method.<br/><ul><li>Overall variance vs. ring variance sum (default)\: tolerant circular symmetry score. Matches partial/scattered circular patterns.</li><li>Ring ageraged variance vs. ring variance sum\: stricter circular symmetry score. The rings must be quite uniform to match.</li><li>Ring median variance vs. ring variance sum\: even stricter circular symmetry score. Rejects interrupted rings, e.g. from tangential non-circular shapes.</li></ul>
