Local.202ca949cf0ce24a=Determines how the cross-section is evaluated for <strong>symmetric</strong> subjects.<br/><ul><li><strong>FullSymmetry</strong> looks for full inner and outline symmetry. Use for truly symmetric subjects and best precision.</li><li><strong>EdgeSymmetry</strong> looks for full inner and outline symmetry of edges. Use for partially symmetric subjects, where some, but not all features are present on both sides, or where shades differ.</li><li><strong>OutlineSymmetry</strong> looks for outline symmetry only. Used for subjects that are symmetric on their outline, but not on the inside.</li><li><strong>OutlineEdgeSymmetry</strong> looks for outline symmetry of edges only. Used for subjects that are symmetric on their outline, but not on the inside, and where some, but not all features are present on both sides, or where shades differ.</li><li><strong>OutlineSymmetryMasked</strong> looks for outline mask symmetry only. Use for quite asymmetric subjects. Requires setting a mask <strong>threshold</strong>.<br/></li></ul>
