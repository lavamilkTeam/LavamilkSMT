Local.1e4a8a3d79f1d917=<html>\r\nUse a parametric template to encode non-boolean actuation values into the URL.<br/>\r\nThe {val} placeholder can be used. <br/>\r\nFormatting is possible in the form of {val\:%f} etc.<br/>\r\n<br/>\r\n<strong>Note\:</strong> no escaping is performed. If using String actuation values, <br/>\r\nyou can use complex URI fragments e.g. drive multiple parameters. \r\n</html>
Local.1e53bdc91c14f83c=<html><p>Camera calibration can be performed automatically by looking at fiducials while moving the camera around in a certain pattern. This solution determines the X, Y position of the primary fiducial and it performs preliminary camera calibration.</p><br/><p>Instructions for how to create and position the primary fiducial must be obtained in the OpenPnP Wiki. <strong>There are very important rules that must be observed\!</strong> Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration primary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera %1$s over the privary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position. The camera will perform a small calibration movement pattern</p></html>
