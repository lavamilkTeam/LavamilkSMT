Local.8f2578892fac8bc4=<html><p>Up-looking camera calibration can be performed automatically by looking at a nozzle tip while moving the nozzle around in a certain pattern. This solution determines the X, Y position of the camera and it performs preliminary camera calibration.</p><br/><p>Load nozzle %1$s with the smallest nozzle tip that you can reliably detect (it may take some trial and error).</p><br/><p>Jog nozzle %2$s over the camera %3$s. Target it with the cross-hairs.</p><br/><p>Jog the nozzle tip point down in Z so it is in focus. This should be more or less on the same Z level as the PCB surface. If not, consider adjusting the camera focus to make it so.</p><br/><p>If enabled, auto-focus will be used to detect the precise Z location.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the wanted contour. Zoom the camera using the scroll-wheel.</p><br/><p>Make sure to target a circular edge that can be detected consistently even when seen from the side. This means it has to be a rather sharp-angled edge. Typically, the air bore contour is targeted.</p><br/><p>Then press Accept to capture the camera position.</p></html>
