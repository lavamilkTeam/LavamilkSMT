Local.1941fc9db0bb29cb=<html><p>You already performed the preliminary camera calibration earlier, now it is time for the <strong>Advanced Camera Calibration</strong> that includes compensating lens distortion and camera mounting tilt. A more profound and precise 3D Units per Pixel calibration is also applied.</p><br/><p>More information can be found in the Wiki (press the blue Info button below).</p><br/><p>The calibration must be performed with the same nozzle tip, that you used for the preliminary calibration. Make sure it is loaded and its <strong>Vision Diameter</strong> is still valid. Furthermore the camera %1$s position (including Z) must still be valid.</p><br/><p>If not, please revisit the <strong>Determine up-looking camera %2$s position</strong> step first (Enable the <strong>Include Solved?</strong> checkbox above, to see revisitable solutions).</p><br/><p><strong color\="red">CAUTION</strong>\: The nozzle %3$s will perform a lengthy calibration motion pattern all over the view area of the camera %4$s. Before pressing <strong>Accept</strong>, you need to be sure nozzle %5$s will not collide with anything\!</p><br/></html>
