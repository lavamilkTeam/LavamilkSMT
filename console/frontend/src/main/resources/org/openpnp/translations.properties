ReferenceNozzleTipPartDetectionWizard.PartOffVacuumSensingPanel.ValveOpenCloseLabel.toolTipText=<html>\n<p>The valve is opened and closed to create a small underpressure pulse. </p>\n<p>The open time should be quite short, no point in creating full pick suction.</p>\n<p>The close time can be used to wait for the system to react to the pulse.<br/>\nincluding delays in sensor signal propagation and readout.</p>\n</html>
