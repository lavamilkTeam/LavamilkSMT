Local.4228d9c89a7b96f4=<html>%1$s<p>Color-keyed computer vision needs stable, and accurate colors. Neither the unstable Auto white balance, nor the device manual white balance is suitable (typically merely a red-blue-shift).Therefore OpenPnP offers its own elaborate and static white balance. You can automatically calibrate it now.</p><br/><p>Make sure a suitable white balance calibration object is visible in the camera view. Brushed metal and paper are recommended. The camera should see all brightness levels, i.e., an assortment of metal objects with holes, bevels, shadows etc. usually provides good gradients.Conversely, make sure there are no colored objects visible. Lighting conditions must be as in operation.<p><br/><p>Alternatively, you can perform white balance on camera %2$s's <strong>White Balance</strong> tab.</p><br><p>Press the blue info button (below) for more information.</p><br><p>When ready, press Accept.</p></html>
Local.4256afe7a604bd10=Nozzle tip %1$s must at least have the First Location defined, before it can clone from the template. The displacement between the two changer slots must be known.
Local.427556e77947cd9e=When the <strong>OutlineSymmetryMasked</strong> function is used, pixels are masked by the <strong>threshold</strong> property. A cross-section pixel count over these masked pixels is then determined. A cross-section bin only counts as "detected" when the pixel count is larger than <strong>minFeatureSize</strong>.<br/>This is used to remove masking imperfections, i.e. image specks and impurities up to a certain size and frequency.
