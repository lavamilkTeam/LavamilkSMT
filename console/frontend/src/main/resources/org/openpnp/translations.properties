Local.91c52f1f77ae3fd6=<html><p>With <strong>Dynamic Safe Z</strong> enabled, the nozzle needs a head-room, the so-called Safe Z Zone to lift the nozzle higher with taller parts. The maximum expected part height is specified on the nozzle tip <strong>Max. Part Height</strong>.</p><br/><p>Nozzle %1$s with compatible tip %2$s has a <strong>Max. Part Height</strong> of %3$s which is larger than the Safe Z Zone of %4$s. Note, the safe Z Zone is configured on the %5$s axis to reach from %6$s to %7$s in (untransformed) coordinates.</p><br/><p>Please either enlarge the Safe Z Zone, by reducing the nozzle %8$s Z clearance, or reduce the <strong>Max. Part Height</strong> on nozzle tip %9$s.</p><br/><p>Reducing Z clearance is best done by revisiting the Safe Z solution for nozzle %10$s. Enable the <strong>Include Solved?</strong> checkbox at the top, then reopen the "Set Safe Z of %11$s" solution and redo it.</p></html>
