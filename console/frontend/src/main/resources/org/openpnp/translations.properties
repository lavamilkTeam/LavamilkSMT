Local.7174275163fc38c1=<html><p>You already performed the preliminary camera calibration earlier, now it is time for the <strong>Advanced Camera Calibration</strong> that includes compensating lens distortion and camera mounting tilt. A more profound and precise 3D Units per Pixel calibration is also applied.</p><br/><p>More information can be found in the Wiki (press the blue Info button below).</p><br/><p>The calibration must be performed with the same calibration rig, that you used for the preliminary calibration. Make sure it is ready, and locations (including Z) are still valid.</p><br/><p>If not, please revisit the <strong>Primary calibration fiducial position</strong> and <strong>Secondary calibration fiducial position</strong> steps first (Enable the <strong>Include Solved?</strong> checkbox above, to see revisitable solutions).</p><br/><p><strong color\="red">CAUTION</strong>\: The camera %1$s will move over the calibration rig and perform a length calibration motion pattern.</p><br/></html>
