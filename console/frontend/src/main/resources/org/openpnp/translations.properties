Local.c76bec13b8a67843=Extracts a rectangular (parallelogrammatic) region of interest from the image that can have any position, size, rotation, scale, <em>shear</em> or even be mirrored. A so-called Affine Transformation Warp.<br/>The coordinates are given in real length units rather than pixels and are relative to the camera center, Y pointing up. This allows the pipeline to be independent of camera model and resolution, lens, focus distance etc. <br/>To setup, pin the previous stage and read off length unit coordinates from the mouse position.
