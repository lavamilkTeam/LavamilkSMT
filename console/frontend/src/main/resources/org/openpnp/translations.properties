ReferenceNozzleConfigurationWizard.OffsetsPanel.AlignwithPartLabel.toolTipText=<html>\n<p>After bottom vision part alignment, make the nozzle Rotation Mode offset<br/>\nalign with the part rotation.</p>\n<br/>\n<p>This will make sure the nozzle coordinates as indicated in the reticle (cross-hairs),<br/>\nin the DRO etc. match the detected rotation of the part.</p>\n<br/>\n<p>After placing/discarding the part, the nozzle snaps back to indicating the original <br/>\naxis rotation.</p>\n</html>
