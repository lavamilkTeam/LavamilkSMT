Local.8f029db8da165cbd=The superSampling value can be used to achieve sub-pixel final precision\:<br/>1 means no supersampling, 2 means half sub-pixel precision etc.<br/>Negative values can be used to stop refining subSampling, -2 means it will stop at a 2-pixel resolution.
