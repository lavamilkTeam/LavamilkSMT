Local.b7a6c72c52f6a392=<html><p>It is recommended to enable nozzle tip calibration for run-out and precision camera offsets. For more information, press the blue Info button (below) to open the Wiki.</p><br/>%1$s<p>Press the <strong>Center Nozzle</strong> button (below) to center nozzle %2$s over the camera %3$s.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the wanted contour. Zoom the camera using the scroll-wheel. Make sure to target a circular edge that can be detected consistently even when seen from the side. This means it has to be a rather sharp-angled edge. To eliminate nozzle and camera tilt errors, choose a contour that is lowest in Z on the nozzle tip. Typically, the air bore contour is targeted.</p><br/><p>Then press Accept to enable and perform the nozzle tip calibration.</p></html>
