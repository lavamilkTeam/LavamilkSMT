GcodeDriverSettings.SettingsPanel.Border.title=Settings
GcodeDriverSettings.SettingsPanel.CommandTimeout.text=Command Timeout [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.text=$-Command Wait Time [ms]
GcodeDriverSettings.SettingsPanel.CommandWaitTimeLabel.toolTipText=<html>\n<p>Whenever a command starts with a <strong>$ </strong> sign, add this wait time before<br/>\nsending the next command. The TinyG controller is known to require this<br/>\npause, so it can write settings to the EEPROM uninterrupted. </p>\n<br/>\n<p>Note\: in an GcodeAsyncDriver without Confirmation Flow Control, <br/>\nthis is only guaranteed to work, if the $-commands are sent to an idle  <br/>\ncontroller. This is the case if $-commands are sent as the first thing in <br/>\nthe <strong>CONNECT_COMMAND</strong>.</p> \n</html>
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.text=Compress G-code?
GcodeDriverSettings.SettingsPanel.CompressGCodeLabel.toolTipText=<html>\r\n<p>Remove unneeded white-space and trailing decimal digits from G-code<br/>\r\nto speed up transmissions to the controller.</p>\r\n<p>Note, this only works with regular G-code syntax.</p>\r\n<p>Example\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1&nbsp;&nbsp;X100.0000     Y20.1000&nbsp;&nbsp;&nbsp;&nbsp;</code></p>\r\n<p>is compressed into\:</p>\r\n<p><code style\="background-color\:\#DDDDDD">G1X100Y20.1</code></p>\r\n</html>
GcodeDriverSettings.SettingsPanel.ConnectWaitTimeoutLabel.text=Connect Wait Time [ms]
GcodeDriverSettings.SettingsPanel.DetectFirmwareButton.text=Detect Firmware
GcodeDriverSettings.SettingsPanel.FirmwareConfigurationTextArea.Detecting.text=Detecting...
GcodeDriverSettings.SettingsPanel.LetterVariablesLabel.text=Letter Variables?
GcodeDriverSettings.SettingsPanel.LetterVariablesLabel.toolTipText=Axis variables in Gcode are named using the Axis Letters rather than the Axis Type.
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.text=Log G-code?
GcodeDriverSettings.SettingsPanel.LogGCodeLabel.toolTipText=Log the generated Gcode into a separate file in the .openpnp2 driver subdirectory.
GcodeDriverSettings.SettingsPanel.MaxFeedRate.text=Max. Feed Rate [/min]
GcodeDriverSettings.SettingsPanel.MaxFeedRate.toolTipText=<html><p>Maximum tool-path feed-rate in driver units per minute. </p>\n<p>Set to 0 to disable and only use axis feed-rate limits. Diagonal moves will then be faster. </p>\n</html>
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.text=Motion Control Type
GcodeDriverSettings.SettingsPanel.MotionControlTypeLabel.toolTipText=<html>\n<p>Determines how the OpenPnP MotionPlanner will plan the motion and how it will talk <br/>\nto the controller\:</p>\n<ul>\n\n<li><strong>ToolpathFeedRate\:</strong><br/>\nApply the nominal driver feed-rate limit multiplied by the speed factor to the tool-path.<br/>\nThe driver feed-rate must be specified. No acceleration control is applied.</li>\n\n<li><strong>EuclideanAxisLimits\:</strong><br/>\nApply axis feed-rate, acceleration and jerk limits multiplied by the proper speed factors. <br/>\nThe Euclidean Metric is calculated to allow the machine to run faster in a diagonal.<br/>\nOpenPnP only sets the speed factor maximum, ramping up and down the speed is <br/>\nentirely left to the controller. </li>  \n\n<li><strong>ConstantAcceleration\:</strong><br/>\nApply motion planning assuming a controller with constant acceleration motion control. </li>\n\n<li><strong>ModeratedConstantAcceleration\:</strong><br/>\nApply motion planning assuming a controller with constant acceleration motion control but<br/>\nmoderate the acceleration and velocity to resemble those of 3rd order control, resulting<br/>\nin a move that takes the same amount of time and has similar average acceleration. <br/>\nThis will already reduce vibrations a bit.</li>\n\n<li><strong>SimpleSCurve\:</strong><br/>\nApply motion planning assuming a controller with simplified S-Curve motion control. <br/>\nSimplified S-Curves have no constant acceleration phase, only jerk phases (e.g. TinyG, Marlin).</li>\n\n<li><strong>Simulated3rdOrderControl\:</strong><br/>\nApply motion planning assuming a controller with constant acceleration motion control but<br/>\nsimulating 3rd order control with time step interpolation. </li> \n\n<li><strong>Full3rdOrderControl\:</strong><br/>\nApply motion planning assuming a controller with full 3rd order motion control.</li> \n\n</html>
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.text=Remove Comments?
GcodeDriverSettings.SettingsPanel.RemoveCommentsLabel.toolTipText=<html>\n<p>Remove comments from G-code to speed up transmissions <br/>\nto the controller.</p>\n<p>Note, this only works with G-code syntax style.</p>\n<p>Example\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 <span style\="color\:\#007700">(move to)</span> X100 Y20 <span style\="color\:\#007700">; move to the given X, Y</span><br/></code></p>\n<p>is sent as\:</p>\n<p><code style\="background-color\:\#DDDDDD">G1 X100 Y20 </code></p>\n</html>
GcodeDriverSettings.SettingsPanel.SendOnChangeAcceleration.text=Send Acceleration On Change Only?
GcodeDriverSettings.SettingsPanel.SendOnChangeAcceleration.toolTipText=Only send Acceleration values to driver when they have actually change.
GcodeDriverSettings.SettingsPanel.SendOnChangeFeedRate.text=Send FeedRate On Change Only?
GcodeDriverSettings.SettingsPanel.SendOnChangeFeedRate.toolTipText=Only send FeedRate values to driver when they have actually change.
GcodeDriverSettings.SettingsPanel.SendOnChangeJerk.text=Send Jerk On Change Only?
GcodeDriverSettings.SettingsPanel.SendOnChangeJerk.toolTipText=Only send Jerk values to driver when they have actually change.
GcodeDriverSettings.SettingsPanel.UnitsLabel.text=Units
GcodeDriverSettings.lblCompressExcludes.text=Compression Exclude Characters
GcodeDriverSettings.lblCompressExcludes.toolTipText=<html>\r\n<p>\r\nCompression of G-code follows the rules of the NIST RS274NGC standard<br/>\r\nfor plain G- and M-command lines.<br/>\r\nHowever, there are some standard and proprietary extensions to the syntax,<br/>\r\nwhere compression and comments removal is inadmissible. To support these<br/>\r\nextensions, you can specify a list of characters that serve as <em>brackets</em> or<br/>\r\n<em>quotes</em> around these parts of the command-lines. \r\n</p>\r\n<p>\r\nThe following are typical examples\:<br/>\r\n<code>&quot; &\#x27; &lt;&gt; {} [] ()</code><br/>\r\n</p>\r\n<p>\r\nBecause of potential syntax ambiguities (escaping, nesting) anything between<br/>\r\nthe left-most and right-most exclude-character is defensively excluded from<br/>\r\ncompression and comments removal. If only a single exclude-character is found,<br/>\r\nthe rest of the line is excluded.<br/>\r\n</p>\r\n<p>\r\nNotes\: use the <code>[]</code> characters, to support NIST RS274NGC section<br/>\r\n3.3.2.3 <em>expressions</em>. Add the <code>()</code> characters if you want to preserve<br/>\r\nround bracket comments when using comments removal. Semicolon end-of-line<br/>\r\ncomments will still be removed.\r\n</p>\r\n</html>
GcodeDriverSettings.lblMinSpeed.text=Min. Supported Speed %
GcodeDriverSettings.lblMinSpeed.toolTipText=<html>\r\n<p>\r\nMinimum Speed % supported by the driver.\r\n</p><p>\r\nExcessively low minimum speeds lead to excessive required precision for<br/>\r\nfeed-rates, acceleration (and jerk) rates. By keeping the minmum speed % at<br/>\r\nreasonable levels (e.g. 5%), the computation and G-code generation can be<br/>\r\noptimized. Fewer decimal digits are required in G-code which lowers required<br/>\r\nserial bandwidth.\r\n</p><p>\r\nLower speeds are still possible, but they will slightly change characteristics,<br/>\r\ne.g. accelerate faster, cruise longer.\r\n</p>\r\n</html>\r\n
