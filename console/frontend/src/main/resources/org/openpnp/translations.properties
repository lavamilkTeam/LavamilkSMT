Local.c1ab66ec4a73b30f=<html><p>Camera calibration also requires looking at a secondary fiducial at different Z level. This will provide the calibration algorithm with the needed 3D/spacial information to determine the true focal length of the lens and the optical position of the camera in space.</p><br/><p>Instructions for how to create and position the secondary fiducial must be obtained in the OpenPnP Wiki. There are very important rules that must be observed, so don't miss it\! Press the blue Info button (below) to open the Wiki.</p><br/><p>Once you have prepared the calibration secondary fiducial you can capture its position in X, Y.</p><br/><p>Jog camera %1$s over the secondary fiducial. Target it roughly with the cross-hairs.</p><br/><p>Adjust the <strong>Feature diameter</strong> up and down and see if it is detected right in the camera view. A green circle and cross-hairs should appear and hug the fiducial contour. Zoom the camera using the scroll-wheel.</p><br/><p>Then press Accept to capture the position.</p></html>
