ReferenceNozzleTipCalibrationWizard.TopPanel.RecalibrationLabel.toolTipText=<html>\n<p>Determines when a recalibration is automatically executed\:</p>\n<p><ul><li>On each nozzle tip change.</li>\n<li>On each nozzle tip change but only in Jobs.</li>\n<li>On machine homing and when first loaded. </li></ul></p>\n<p>Manual with stored calibration (only recommended for machines <br /> \nwith C axis homing).</p>\n</html>
