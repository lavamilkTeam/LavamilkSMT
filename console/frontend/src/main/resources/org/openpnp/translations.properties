Local.84bce9f5ce0f49fb=<html>By default, every time a script should be executed, a new instance of the appropriate script engine is created.<br><br>By enabling script engine pooling, a new instance of any script engine is only created if the pool doesn't contain an available instance of the appropriate type. Following executions re-use the already initialized script engines, lowering execution time for scripting hooks.This feature is only relevant if you use scripting in OpenPnP.<br><br><span style\="color\:red;">Script engine pooling can - depending on the script engine implementation - cause global state to be kept in following invocations. Check the wiki for further information.</span></html>
